[package]
name = "wlam-sleigh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "x86-32 lifter backed by Ghidra Sleigh, with a differential gate against the wasm emitter"

[dependencies]
wlam-pcode = { path = "../wlam-pcode" }
wlam-pe = { path = "../wlam-pe" }
wlam-emit = { path = "../wlam-emit" }
rsleigh-api = { path = "../../toolchain/rsleigh/rsleigh-api" }
pcode-ir = { path = "../../toolchain/rsleigh/pcode-ir" }
wasmparser = { version = "0.221.3", default-features = false, features = ["std", "validate", "features"] }

[dev-dependencies]
wlam-host = { path = "../wlam-host" }
wlam-harness = { path = "../wlam-harness" }
# iced-x86 is a *test-only* cross-check: it decodes the same bytes with an
# independent decoder so Sleigh's control-flow facts can be validated. It must
# never be used by the production lifter -- Sleigh stays the semantic source of
# truth. A dev-dependency enforces that: shipping code cannot reach it.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "std", "instr_info", "intel"] }
