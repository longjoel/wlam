[package]
name = "wlam-sleigh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "x86-32 lifter backed by Ghidra's Sleigh specification (via rsleigh)"

# Deliberately not a member of the main workspace: it depends on the vendored
# rsleigh checkout under toolchain/, which is fetched and generated on demand
# by scripts/fetch-deps.sh rather than committed to this repository.
[workspace]

[dependencies]
rsleigh-api = { path = "../../toolchain/rsleigh/rsleigh-api" }
pcode-ir = { path = "../../toolchain/rsleigh/pcode-ir" }
