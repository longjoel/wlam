[workspace]
resolver = "2"
members = [
    "crates/wlam-pe",
    "crates/wlam-pcode",
    "crates/wlam-lift-x86",
    "crates/wlam-translate",
    "crates/wlam-emit",
    "crates/wlam-host",
    "crates/wlam-harness",
    "crates/wlam-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/wlam"

[workspace.dependencies]
wlam-pe = { path = "crates/wlam-pe" }
wlam-pcode = { path = "crates/wlam-pcode" }
wlam-lift-x86 = { path = "crates/wlam-lift-x86" }
wlam-translate = { path = "crates/wlam-translate" }
wlam-emit = { path = "crates/wlam-emit" }
wlam-host = { path = "crates/wlam-host" }

thiserror = "2"
libm = "0.2"
wasmi = "0.40"

[profile.release]
lto = "thin"
codegen-units = 1
